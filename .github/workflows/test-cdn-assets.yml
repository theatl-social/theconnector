name: Test CDN Assets Configuration

on:
  pull_request:
    paths:
      - 'vite.config.mts'
      - 'Dockerfile'
      - 'app/javascript/**'
      - '.github/workflows/test-cdn-assets.yml'
  push:
    branches:
      - main
      - forked-main
    paths:
      - 'vite.config.mts'
      - 'Dockerfile'
      - 'app/javascript/**'

jobs:
  test-cdn-manifest:
    name: Validate CDN Asset Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js dependencies
        run: yarn install --immutable

      - name: Build assets with test CDN_HOST
        env:
          CDN_HOST: https://cdn-test.example.com
          RAILS_ENV: production
          NODE_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
        run: |
          # Build assets with CDN_HOST set
          yarn build:production

      - name: Verify Vite manifest exists
        run: |
          echo "📦 Checking Vite manifest file..."

          if [ ! -f "public/packs/.vite/manifest.json" ]; then
            echo "❌ Manifest file not found"
            exit 1
          fi

          echo "✅ Manifest file exists"

          # NOTE: Vite's `base` configuration does NOT modify manifest.json paths.
          # Manifest paths are relative by design - they're meant to be combined
          # with the base URL by the application framework (Rails/vite_rails).
          #
          # What actually matters is whether generated JavaScript files contain
          # CDN URLs in their dynamic import() statements. Testing this is done
          # in the next step.

      - name: Verify CDN URLs in generated JavaScript bundles
        run: |
          echo "🔍 Checking generated JavaScript for CDN_HOST usage..."

          # Find a main application bundle (not a chunk or locale file)
          js_file=$(find public/packs -name "application-*.js" -type f ! -name "*.map" | head -1)

          if [ -z "$js_file" ]; then
            echo "❌ No application bundle found"
            exit 1
          fi

          echo "📄 Checking JS file: $js_file"

          # Check if the bundle contains the CDN_HOST in import statements
          # Vite's base config should inject the CDN URL into dynamic imports
          if grep -q "https://cdn-test.example.com/packs/" "$js_file"; then
            echo "✅ Found CDN_HOST in generated JavaScript imports"
            echo "📊 Sample JS imports found:"
            grep -o 'https://cdn-test.example.com/packs/[^"]*' "$js_file" | head -3
          else
            echo "❌ CDN_HOST not found in generated JavaScript"
            echo "⚠️  This means dynamic imports may not use the CDN!"
            echo ""
            echo "Searching for any import statements in the bundle:"
            grep -o 'import([^)]*' "$js_file" | head -5 || echo "No import statements found"
            exit 1
          fi

      - name: Verify CDN URLs in generated CSS files
        run: |
          echo "🔍 Checking generated CSS for CDN_HOST usage..."

          # Find a CSS file
          css_file=$(find public/packs -name "*.css" -type f ! -name "*.map" | head -1)

          if [ -z "$css_file" ]; then
            echo "⚠️  No CSS files found (may be normal for minimal builds)"
            exit 0
          fi

          echo "📄 Checking CSS file: $css_file"

          # Check if CSS contains CDN_HOST for asset references (fonts, images, etc.)
          # Vite's base config should inject the CDN URL into url() references
          if grep -q "https://cdn-test.example.com/packs/" "$css_file"; then
            echo "✅ Found CDN_HOST in generated CSS asset references"
            echo "📊 Sample CSS references found:"
            grep -o 'url([^)]*https://cdn-test.example.com/packs/[^)]*' "$css_file" | head -3
          else
            # CSS might not have any asset references, which is okay
            echo "ℹ️  No CDN_HOST found in CSS (may not reference any assets)"
          fi

      # NOTE: Emoji handling in Vite builds
      # Emoji source files (SVGs) live in public/emoji/ and are served statically.
      # Emoji data (emoji_map.json, emoji_data.json) lives in app/javascript/mastodon/features/emoji/
      # and is embedded directly into JavaScript bundles via the MastodonEmojiCompressed Vite plugin.
      #
      # No emoji JSON files are output to public/packs/emoji/ - this directory doesn't exist
      # in Vite builds. The workflow previously tested for public/packs/emoji/*.json which was
      # incorrect. Emoji data is bundled into JS, not output as separate JSON files.

      - name: Check for hardcoded /packs/ paths in TypeScript
        run: |
          echo "🔍 Scanning for hardcoded /packs/ paths in JavaScript/TypeScript..."

          # Look for hardcoded paths (excluding legitimate cases)
          # Exclude:
          # - import.meta.env.DEV checks (used for dev vs prod paths)
          # - Comments
          # - Test files

          if grep -r "'/packs/" app/javascript \
             --include="*.ts" \
             --include="*.tsx" \
             --include="*.js" \
             --include="*.jsx" \
             --exclude-dir="__tests__" \
             --exclude-dir="__mocks__" \
             | grep -v "import.meta.env.DEV" \
             | grep -v "packs-dev" \
             | grep -v "packs-test" \
             | grep -v "\/\/" \
             | grep -v "\/\*"; then
            echo "❌ Found hardcoded /packs/ paths"
            echo "💡 These should use CDN-aware URL construction"
            exit 1
          fi

          echo "✅ No hardcoded /packs/ paths found"

      - name: Verify build without CDN_HOST still works
        run: |
          echo "🔍 Testing build without CDN_HOST (backward compatibility)..."

          # Clean previous build
          rm -rf public/packs

          # Build without CDN_HOST
          SECRET_KEY_BASE_DUMMY=1 \
          RAILS_ENV=production \
          NODE_ENV=production \
          yarn build:production

          # Verify manifest exists and has relative paths (not absolute CDN URLs)
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('public/packs/.vite/manifest.json', 'utf8'));

          let hasAbsoluteUrls = false;
          for (const [key, entry] of Object.entries(manifest)) {
            if (entry.file && entry.file.startsWith('http')) {
              hasAbsoluteUrls = true;
              console.error('❌ Found absolute URL in manifest without CDN_HOST:', entry.file);
              break;
            }
          }

          if (hasAbsoluteUrls) {
            console.error('❌ Build without CDN_HOST should produce relative paths, not absolute URLs');
            process.exit(1);
          }

          console.log('✅ Build without CDN_HOST works correctly (backward compatible)');
          "

      - name: Summary
        if: success()
        run: |
          echo "
          ✅ All CDN asset tests passed!

          Tests completed:
          - ✅ Vite manifest exists and builds successfully
          - ✅ CDN URLs found in generated JavaScript bundles (dynamic imports verified)
          - ✅ CDN URLs verified in generated CSS files (asset references checked)
          - ✅ No hardcoded /packs/ paths in TypeScript source
          - ✅ Backward compatibility maintained (build without CDN_HOST works)
          "
